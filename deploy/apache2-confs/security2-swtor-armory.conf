<IfModule security2_module>
    SecRuleEngine On

    SecAction "id:100000,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"

    SecRule REQUEST_METHOD "@streq POST" \
        "id:100010,phase:1,nolog,pass,chain"
        SecRule REQUEST_URI "@streq /api/auth/login" \
            "setvar:ip.swtor_login_count=+1,expirevar:ip.swtor_login_count=60"

    SecRule IP:SWTOR_LOGIN_COUNT "@gt 10" \
        "id:100011,phase:1,deny,status:429,log,msg:'SWTOR Armory login rate limit exceeded'"
</IfModule>
