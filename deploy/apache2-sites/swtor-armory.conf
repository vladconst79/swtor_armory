<VirtualHost *:80>
    ServerName armory.example.com
    ServerAlias alias.example.com

    DocumentRoot /var/www/swtor-armory/public_html

    RewriteEngine On
    RewriteRule ^/\. - [R=404,L]
    RewriteRule ^/(?:.*\.env.*|\.git(?:/.*)?|config\.(?:js|json)|settings\.js|js/(?:env|config)\.js)$ - [R=404,L]

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "DENY"

    ProxyPreserveHost On
    ProxyPass /api/ http://192.168.19.24:8000/api/
    ProxyPassReverse /api/ http://192.168.19.24:8000/api/
    
    <IfModule security2_module>
        SecRuleEngine On

        SecAction \
            "id:100000,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"

        SecRule REQUEST_METHOD "@streq POST" \
            "id:100010,phase:1,nolog,pass,chain"
            SecRule REQUEST_URI "@streq /api/auth/login" \
                "setvar:ip.swtor_login_count=+1,expirevar:ip.swtor_login_count=60"

        SecRule REQUEST_METHOD "@streq POST" \
            "id:100011,phase:1,deny,status:429,log,msg:'SWTOR Armory login rate limit exceeded',chain"
            SecRule REQUEST_URI "@streq /api/auth/login" "chain"
            SecRule IP:SWTOR_LOGIN_COUNT "@gt 10"
    </IfModule>

    <Directory /var/www/swtor-armory/public_html>
        Require all granted
        Options -Indexes
        AllowOverride None

        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/swtor-armory-error.log
    CustomLog ${APACHE_LOG_DIR}/swtor-armory-access.log combined
</VirtualHost>
