stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

cache:
  key:
    files:
      - backend/requirements.txt
      - frontend/package-lock.json
  paths:
    - .cache/pip
    - .cache/npm
    - frontend/node_modules/

backend:test:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd backend
    - python -m venv .venv
    - .venv/bin/python -m pip install --upgrade pip
    - .venv/bin/python -m pip install -r requirements.txt
  script:
    - .venv/bin/python -m compileall app alembic tests
    - .venv/bin/python -m alembic heads
    - .venv/bin/python -m pytest

frontend:lint:
  stage: test
  image: node:26-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint

frontend:build:
  stage: build
  image: node:26-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - frontend/dist/
